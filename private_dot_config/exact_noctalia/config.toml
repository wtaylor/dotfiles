[backdrop]
blur_intensity = 0.37999999150633812
tint_intensity = 0.51999998837709427

[bar.default]
center = [ "date", "clock" ]
font_family = "Montserrat SemiBold"
font_weight = 600
margin_edge = 0
margin_ends = 0
radius = 0
start = [ "launcher", "workspaces" ]

[calendar]
enabled = true

[location]
address = "Edinburgh"

[lockscreen]
wallpaper = "/var/home/wtaylor/Pictures/Wallpapers/earth.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-7",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-7"]
    box_height = 70.0
    box_width = 400.0
    cx = 2128.0
    cy = 720.0
    output = "DP-7"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-7".settings]
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 64.0
    box_width = 384.0
    cx = 1088.0
    cy = 501.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 400.0
    cx = 408.0
    cy = 501.5
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_radius = 7.0
        clock_style = "digital"
        color = "on_surface_variant"
        format = "{:%H:%M:%S}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 176.0
    box_width = 464.0
    cx = 1288.0
    cy = 720.0
    output = "DP-7"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        color = "on_surface_variant"
        format = "{:%H:%M:%S}"
        shadow = false

[shell]
avatar_path = "/var/home/wtaylor/.face"
clipboard_history_max_entries = 10
polkit_agent = true
time_format = "{:%H:%M:%S}"

    [shell.animation]
    speed = 2.0000000298023224

[theme]
builtin = "Nord"
community_palette = "Rose Pine Moon"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "starship" ]
    community_ids = [ "fuzzel", "rofi", "steam", "telegram" ]

[widget.battery]
capsule = true
display_mode = "graphic"
show_label = false

[widget.bluetooth]
capsule = true

[widget.clipboard]
capsule = true

[widget.clock]
format = "{:%H:%M:%S}"

[widget.control-center]
capsule = true

[widget.date]
format = "{:%A %d %b}"

[widget.launcher]
capsule = true

[widget.media]
capsule = true
hide_when_no_media = true

[widget.network]
capsule = true

[widget.notifications]
capsule = true
hide_when_no_unread = true

[widget.session]
capsule = true

[widget.tray]
capsule = true

[widget.volume]
capsule = true
show_label = false